<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#8438fc">

        <title>{% block title %}VoidWave{% endblock %} | VoidWave</title>
        <meta name="description" content="{% block meta_description %}Modern Discord bot with leveling, LLM chat, fun commands, and daily Question of the Day. Clean, fast, slightly chaotic.{% endblock %}">

        {% block og_tags %}
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="VoidWave">
        <meta property="og:url" content="https://voidwave.xangey.dev/">
        <meta property="og:title" content="VoidWave">
        <meta property="og:description" content="Modern Discord bot with leveling, LLM chat, fun commands, and daily Question of the Day.">
        <meta property="og:image" content="https://voidwave.xangey.dev/static/images/og.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        {% endblock %}

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:site" content="@voidwave">
        <meta name="twitter:image" content="https://voidwave.xangey.dev/static/images/og.png">

        <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body {% block body_attrs %}{% endblock %}>
        <nav class="navbar">
            <div class="nav-container">
                <a href="{{ url_for('index') }}" class="nav-logo">
                    <img src="/static/images/favicon.png" alt="VoidWave" class="logo-icon">
                    <span class="logo-text">VoidWave</span>
                </a>
                <div class="nav-links">
                    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
                    <a href="/leaderboard" class="nav-link {% if request.path == '/leaderboard' %}active{% endif %}">Leaderboard</a>
                    <a href="/commands" class="nav-link {% if request.path == '/commands' %}active{% endif %}">Commands</a>
                    <div class="nav-dropdown">
                        <button class="nav-link nav-dropdown-toggle">More &#9662;</button>
                        <div class="nav-dropdown-menu">
                            <a href="/stats" class="nav-dropdown-item {% if request.path == '/stats' %}active{% endif %}">Stats</a>
                            <a href="/status" class="nav-dropdown-item {% if request.path == '/status' %}active{% endif %}">Status</a>
                            <a href="/faq" class="nav-dropdown-item {% if request.path == '/faq' %}active{% endif %}">FAQ</a>
                            <a href="/setup" class="nav-dropdown-item {% if request.path == '/setup' %}active{% endif %}">Setup</a>
                            <a href="https://github.com/xangeyfun/VoidWave" target="_blank" class="nav-dropdown-item">GitHub</a>
                        </div>
                    </div>
                    <a href="https://discord.com/oauth2/authorize?client_id=1442229230384709752" target="_blank" class="nav-link btn-invite">Invite</a>
                </div>
                <button class="nav-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>

        <main class="main-content">
            <canvas id="particles-canvas"></canvas>
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            <div class="footer-container">
                <div class="footer-brand">
                    <img src="/static/images/favicon.png" alt="VoidWave" class="logo-icon">
                    <span>VoidWave</span>
                </div>
                <div class="footer-links">
                    <a href="/terms">Terms</a>
                    <a href="/privacy">Privacy</a>
                    <a href="https://discord.gg/tyQksBReAS" target="_blank">Support</a>
                </div>
                <div class="footer-copy">
                    &copy; <span id="footerYear"></span> VoidWave.
                </div>
            </div>
        </footer>

        <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">&#x2191;</button>

        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    </body>
</html>
